<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Paper Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         Oxygen, Ubuntu, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .header {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 20px 40px;
        }

        .header h1 {
            font-size: 24px;
            color: #f1f5f9;
            font-weight: 600;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 4px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #3b82f6;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 14px;
            cursor: pointer;
        }

        .file-input-wrapper input[type="file"]::file-selector-button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 10px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-primary:disabled {
            background-color: #1e40af;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .result-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-top: 16px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.7;
            max-height: 500px;
            overflow-y: auto;
            display: none;
        }

        .result-box.visible {
            display: block;
        }

        .result-box h2 {
            color: #3b82f6;
            font-size: 16px;
            margin: 16px 0 8px 0;
        }

        .result-box strong {
            color: #f1f5f9;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .status-bar.visible {
            display: flex;
        }

        .status-bar.success {
            background-color: #052e16;
            border: 1px solid #166534;
            color: #4ade80;
        }

        .status-bar.error {
            background-color: #2a0a0a;
            border: 1px solid #991b1b;
            color: #fca5a5;
        }

        .status-bar.loading {
            background-color: #1e1b4b;
            border: 1px solid #3730a3;
            color: #a5b4fc;
        }

        .meta-info {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
            font-size: 12px;
            color: #64748b;
        }

        .meta-info span {
            background-color: #1e293b;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #334155;
        }

        .paper-id-display {
            background-color: #052e16;
            border: 1px solid #166534;
            color: #4ade80;
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }

        .paper-id-display.visible {
            display: block;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #334155;
            margin: 30px 0;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #a5b4fc;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sources-toggle {
            color: #3b82f6;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            display: inline-block;
        }

        .sources-toggle:hover {
            text-decoration: underline;
        }

        .sources-content {
            display: none;
            margin-top: 8px;
            padding: 12px;
            background-color: #1e293b;
            border-radius: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        .sources-content.visible {
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Research Paper Assistant</h1>
        <p>Upload research papers and get AI-powered analysis using RAG</p>
    </div>

    <div class="container">

        <!-- API Key Section -->
        <div class="card">
            <div class="card-title">1. Connect</div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your API key (API_KEY_SECRET from .env)">
            </div>
            <button class="btn btn-primary" onclick="testConnection()">Test Connection</button>
            <div class="status-bar" id="connectionStatus"></div>
        </div>

        <!-- Upload Section -->
        <div class="card">
            <div class="card-title">2. Upload Research Paper</div>
            <div class="form-group">
                <label>PDF File (max 10MB)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="pdfFile" accept=".pdf">
                </div>
            </div>
            <button class="btn btn-primary" onclick="uploadPaper()" id="uploadBtn">Upload and Process</button>
            <div class="status-bar" id="uploadStatus"></div>
            <div class="paper-id-display" id="paperIdDisplay"></div>
        </div>

        <!-- Question Section -->
        <div class="card">
            <div class="card-title">3. Ask Questions</div>
            <div class="form-group">
                <label>Paper ID</label>
                <input type="text" id="paperId" placeholder="Paste the paper ID from upload response">
            </div>
            <div class="form-group">
                <label>Your Question</label>
                <textarea id="question" placeholder="What is the main objective of this research? What methodology was used? What are the key findings?"></textarea>
            </div>
            <button class="btn btn-primary" onclick="askQuestion()" id="askBtn">Ask Question</button>
            <div class="status-bar" id="questionStatus"></div>
            <div class="result-box" id="answerResult"></div>
            <div class="meta-info" id="answerMeta"></div>
        </div>

        <!-- Analysis Section -->
        <div class="card">
            <div class="card-title">4. Paper Analysis</div>
            <div class="form-group">
                <label>Paper ID</label>
                <input type="text" id="analysisPaperId" placeholder="Paste the paper ID from upload response">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="analyzePaper('summarize')">Summarize</button>
                <button class="btn btn-secondary" onclick="analyzePaper('key_findings')">Key Findings</button>
                <button class="btn btn-secondary" onclick="analyzePaper('methodology')">Methodology</button>
            </div>
            <div class="status-bar" id="analysisStatus"></div>
            <div class="result-box" id="analysisResult"></div>
            <div class="meta-info" id="analysisMeta"></div>
        </div>

    </div>

    <script>
        const API_BASE = window.location.origin;

        function getApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (!key) {
                alert('Please enter your API key first.');
                return null;
            }
            return key;
        }

        function showStatus(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.className = 'status-bar visible ' + type;
            if (type === 'loading') {
                el.innerHTML = '<div class="spinner"></div> ' + message;
            } else {
                el.textContent = message;
            }
        }

        function hideStatus(elementId) {
            document.getElementById(elementId).className = 'status-bar';
        }

        function formatMarkdown(text) {
            // Convert markdown-like formatting to HTML
            text = text.replace(/## (.*)/g, '<h2>$1</h2>');
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\n- /g, '\n  - ');
            return text;
        }

        async function testConnection() {
            const key = getApiKey();
            if (!key) return;

            showStatus('connectionStatus', 'Testing connection...', 'loading');

            try {
                const response = await fetch(API_BASE + '/api/v1/health');
                const data = await response.json();

                if (data.status === 'healthy') {
                    showStatus('connectionStatus',
                        'Connected successfully. Server version: ' + data.version +
                        ' | Environment: ' + data.environment, 'success');
                } else {
                    showStatus('connectionStatus', 'Server responded but status is not healthy.', 'error');
                }
            } catch (error) {
                showStatus('connectionStatus', 'Cannot connect to server: ' + error.message, 'error');
            }
        }

        async function uploadPaper() {
            const key = getApiKey();
            if (!key) return;

            const fileInput = document.getElementById('pdfFile');
            if (!fileInput.files.length) {
                alert('Please select a PDF file first.');
                return;
            }

            const file = fileInput.files[0];
            if (!file.name.toLowerCase().endsWith('.pdf')) {
                alert('Please select a PDF file.');
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            showStatus('uploadStatus', 'Uploading and processing paper. This may take 10-30 seconds...', 'loading');

            try {
                const formData = new FormData();
                formData.append('file', file);

                const response = await fetch(API_BASE + '/api/v1/papers/upload', {
                    method: 'POST',
                    headers: { 'X-API-Key': key },
                    body: formData,
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('uploadStatus',
                        'Paper processed successfully. Pages: ' + data.pages +
                        ' | Chunks: ' + data.chunks, 'success');

                    const paperIdEl = document.getElementById('paperIdDisplay');
                    paperIdEl.textContent = 'Paper ID: ' + data.paper_id + '  (copied to fields below)';
                    paperIdEl.className = 'paper-id-display visible';

                    // Auto-fill paper ID in other sections
                    document.getElementById('paperId').value = data.paper_id;
                    document.getElementById('analysisPaperId').value = data.paper_id;
                } else {
                    showStatus('uploadStatus', 'Error: ' + (data.detail || JSON.stringify(data)), 'error');
                }
            } catch (error) {
                showStatus('uploadStatus', 'Upload failed: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload and Process';
            }
        }

        async function askQuestion() {
            const key = getApiKey();
            if (!key) return;

            const paperId = document.getElementById('paperId').value.trim();
            const question = document.getElementById('question').value.trim();

            if (!paperId) { alert('Please enter a Paper ID.'); return; }
            if (!question || question.length < 10) {
                alert('Please enter a question (at least 10 characters).');
                return;
            }

            const btn = document.getElementById('askBtn');
            btn.disabled = true;
            btn.textContent = 'Thinking...';
            showStatus('questionStatus', 'Searching paper and generating answer...', 'loading');

            try {
                const response = await fetch(API_BASE + '/api/v1/papers/question', {
                    method: 'POST',
                    headers: {
                        'X-API-Key': key,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        paper_id: paperId,
                        question: question,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    hideStatus('questionStatus');

                    const resultEl = document.getElementById('answerResult');
                    resultEl.innerHTML = formatMarkdown(data.answer);
                    resultEl.className = 'result-box visible';

                    const metaEl = document.getElementById('answerMeta');
                    metaEl.innerHTML =
                        '<span>Model: ' + data.model + '</span>' +
                        '<span>Tokens: ' + data.tokens_used.total_tokens + '</span>' +
                        '<span>Latency: ' + data.latency_ms + 'ms</span>' +
                        '<br><span class="sources-toggle" onclick="toggleSources(\'questionSources\')">Show source chunks used</span>' +
                        '<div class="sources-content" id="questionSources">' +
                        data.sources.map(function(s, i) {
                            return '<strong>Chunk ' + (i+1) + ':</strong> ' + s + '\n\n';
                        }).join('') + '</div>';
                } else {
                    showStatus('questionStatus', 'Error: ' + (data.detail || JSON.stringify(data)), 'error');
                    document.getElementById('answerResult').className = 'result-box';
                }
            } catch (error) {
                showStatus('questionStatus', 'Request failed: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ask Question';
            }
        }

        async function analyzePaper(analysisType) {
            const key = getApiKey();
            if (!key) return;

            const paperId = document.getElementById('analysisPaperId').value.trim();
            if (!paperId) { alert('Please enter a Paper ID.'); return; }

            const labels = {
                'summarize': 'Generating summary',
                'key_findings': 'Extracting key findings',
                'methodology': 'Analyzing methodology'
            };

            showStatus('analysisStatus', labels[analysisType] + '... This may take 15-30 seconds.', 'loading');

            try {
                const response = await fetch(API_BASE + '/api/v1/papers/analyze', {
                    method: 'POST',
                    headers: {
                        'X-API-Key': key,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        paper_id: paperId,
                        analysis_type: analysisType,
                    }),
                });

                const data = await response.json();

                if (response.ok) {
                    hideStatus('analysisStatus');

                    const resultEl = document.getElementById('analysisResult');
                    resultEl.innerHTML = formatMarkdown(data.content);
                    resultEl.className = 'result-box visible';

                    document.getElementById('analysisMeta').innerHTML =
                        '<span>Model: ' + data.model + '</span>' +
                        '<span>Tokens: ' + data.tokens_used.total_tokens + '</span>' +
                        '<span>Latency: ' + data.latency_ms + 'ms</span>';
                } else {
                    showStatus('analysisStatus', 'Error: ' + (data.detail || JSON.stringify(data)), 'error');
                    document.getElementById('analysisResult').className = 'result-box';
                }
            } catch (error) {
                showStatus('analysisStatus', 'Request failed: ' + error.message, 'error');
            }
        }

        function toggleSources(elementId) {
            const el = document.getElementById(elementId);
            el.classList.toggle('visible');
        }
    </script>

</body>
</html>
